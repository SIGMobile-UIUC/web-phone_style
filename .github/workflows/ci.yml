name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # one pinned Bun for everyone; bump it on purpose, not by accident
      - run: bun install --frozen-lockfile
      # typecheck + unit/content tests + production build
      - run: bun run check
